spring.application.name=aegis
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false
server.tomcat.connection-timeout=20s
server.tomcat.max-http-form-post-size=1MB

# 接口监听。0.0.0.0 表示所有网卡，127.0.0.1 只给本机。
server.address=0.0.0.0
server.port=8080

# live 读真节点，sandbox 用模拟余额。testnet 或 mainnet 决定下面用哪一组 RPC。
aegis.mode=live
aegis.network=testnet

# 空着时和 Go 共用仓库里的 server/data。要分开库就写另一个目录。
aegis.data-dir=

# 64 位十六进制。空着就读写 data-dir 里的 card.key。
aegis.card-key=

# 结算适配器。http 是手写 JSON-RPC，web3j 是 web3j。节点必须是本机 Hardhat。
aegis.adapter.settlement=http
aegis.adapter.settlement.rpc=http://127.0.0.1:8545
# 空着时按工作目录找 contracts/deployments/local.json，合约地址仍从这份文件读。
aegis.adapter.settlement.file=

# 余额、报价和转账适配器连的节点。aegis.network 决定用哪一组。
aegis.adapter.testnet.ethereum=https://ethereum-sepolia.publicnode.com
aegis.adapter.testnet.bnb=https://bsc-testnet.publicnode.com
aegis.adapter.testnet.solana=https://api.devnet.solana.com
aegis.adapter.testnet.tron=https://api.shasta.trongrid.io
aegis.adapter.testnet.bitcoin=https://mempool.space/testnet/api

aegis.adapter.mainnet.ethereum=https://ethereum.publicnode.com
aegis.adapter.mainnet.bnb=https://bsc-dataseed.binance.org
aegis.adapter.mainnet.solana=https://api.mainnet-beta.solana.com
aegis.adapter.mainnet.tron=https://api.trongrid.io
aegis.adapter.mainnet.bitcoin=https://mempool.space/api
